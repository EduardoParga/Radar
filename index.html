<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LEADEER</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#15171a;font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:1000px;margin:auto;padding:28px 16px}.brand{font-weight:900;letter-spacing:.15em}h1{font-size:38px}.panel,.lead{background:white;border:1px solid #e1e5eb;border-radius:16px;padding:20px}.grid{display:grid;grid-template-columns:2fr 2fr 1fr;gap:12px}label{font-size:13px;font-weight:700;display:flex;flex-direction:column;gap:6px}input,select{padding:12px;border:1px solid #d5dae2;border-radius:9px;font:inherit}button{margin-top:15px;padding:12px 17px;border:0;border-radius:9px;background:#111;color:#fff;font-weight:800}.lead{display:flex;gap:16px;margin:12px 0}.score{font-size:27px;font-weight:900;min-width:70px}.meta,.details{font-size:13px;color:#68717c}.status{font-weight:800;margin-top:9px}.actions{display:flex;gap:7px;margin-top:10px}.actions a{border:1px solid #d5dae2;border-radius:8px;padding:7px;text-decoration:none;color:#111;font-size:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}h1{font-size:30px}}</style></head><body><main>
<div class="brand">LEADEER</div><h1>Encontre empresas que podem precisar de um site.</h1><p>Pesquisa dados reais do OpenStreetMap.</p>
<section class="panel"><div class="grid"><label>Segmento<input id="cat" value="odontologia"></label><label>Cidade / região<input id="city" value="Rio de Janeiro, RJ"></label><label>Avaliação mínima<select id="rating"><option value="0">Qualquer</option><option value="4">4,0+</option><option value="4.5">4,5+</option></select></label></div><label style="margin-top:14px;flex-direction:row;align-items:center"><input id="nosite" type="checkbox" checked> Somente sem site cadastrado</label><button id="go">🔎 Encontrar leads</button></section><div id="msg"></div><section id="results"></section>
</main><script>
const $=x=>document.getElementById(x), esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function score(x){let s=45;if(!x.website)s+=30;if(x.rating>=4.5)s+=10;else if(x.rating>=4)s+=6;if(x.reviews>=100)s+=10;else if(x.reviews>=30)s+=6;if(x.phone)s+=3;return Math.min(100,s)}
async function search(){go.disabled=true;msg.textContent="Pesquisando empresas reais...";results.innerHTML="";try{
let cat=$("cat").value.trim().toLowerCase(),city=$("city").value.trim(),min=+$("rating").value,only=$("nosite").checked;
let g=await fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q="+encodeURIComponent(city));let geo=await g.json();if(!geo.length)throw Error("Cidade não encontrada.");
let lat=+geo[0].lat,lon=+geo[0].lon,q=`[out:json][timeout:35];nwr(around:25000,${lat},${lon})["name"];out center tags;`;
let r=await fetch("https://overpass-api.de/api/interpreter",{method:"POST",body:"data="+encodeURIComponent(q)});if(!r.ok)throw Error("Fonte ocupada. Tente novamente.");
let d=await r.json(),words=cat.split(/\s+/);let a=d.elements.map(e=>{let t=e.tags||{},hay=[t.name,t.amenity,t.shop,t.office,t.healthcare,t["healthcare:speciality"],t.description,t.cuisine].filter(Boolean).join(" ").toLowerCase();if(cat!=="empresa"&&!words.some(w=>hay.includes(w)))return null;let website=t.website||t["contact:website"]||"",phone=t.phone||t["contact:phone"]||"",rating=parseFloat(t.stars)||0,reviews=parseInt(t["review:count"])||0,la=e.lat??e.center?.lat,lo=e.lon??e.center?.lon;return{name:t.name||"Empresa sem nome",rating,reviews,website,phone,map:la&&lo?`https://www.openstreetmap.org/?mlat=${la}&mlon=${lo}`:"",score:0}}).filter(Boolean).filter(x=>x.rating>=min);if(only)a=a.filter(x=>!x.website);a=a.map(x=>({...x,score:score(x)})).sort((x,y)=>y.score-x.score).slice(0,100);
msg.textContent=a.length+" leads encontrados.";results.innerHTML="<h2>Leads encontrados</h2>"+a.map(x=>`<article class="lead"><div class="score">${x.score}<small>/100</small></div><div><h3>${esc(x.name)}</h3><div class="meta">⭐ ${x.rating?x.rating.toFixed(1):"—"} · ${x.reviews} avaliações</div><div class="status">${x.website?"🌐 Site cadastrado":"🔥 SEM SITE CADASTRADO"}</div><div class="details">${esc(x.phone)}</div><div class="actions">${x.phone?`<a href="https://wa.me/${x.phone.replace(/\D/g,"")}" target="_blank">WhatsApp</a>`:""}${x.map?`<a href="${x.map}" target="_blank">Mapa</a>`:""}</div></div></article>`).join("");
}catch(e){msg.textContent="Erro: "+e.message}finally{go.disabled=false}}
go.onclick=search;
</script></body></html>
